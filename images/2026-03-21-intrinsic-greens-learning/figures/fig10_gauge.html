<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gauge Symmetry</title><link href="https://fonts.googleapis.com/css2?family=Inter&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#f9f9f9;--bg-alt:#fff;--text:#171717;--muted:#666;--border:#e2e8f0;
  --border-strong:#cbd5e1;--primary:#A51209;--blue:#3b82f6;--green:#10b981;
  --amber:#f59e0b;--purple:#8b5cf6;--red:#ef4444;}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--bg-alt:#171717;--text:#e2e2e2;--muted:#888;--border:#374151;--border-strong:#4b5563;}}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Inter',sans-serif;display:flex;flex-direction:column;
  align-items:center;padding:28px 20px 22px;}
.ey{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-bottom:5px;}
.ti{font-family:'Inter',sans-serif;font-size:20px;color:var(--text);text-align:center;margin-bottom:3px;}
.su{font-size:13px;color:var(--muted);text-align:center;margin-bottom:18px;}
.cap{margin-top:14px;font-size:12.5px;color:var(--muted);max-width:700px;text-align:center;line-height:1.7;}
.cap em{color:var(--text);font-style:normal;font-weight:500;}
svg{display:block;max-width:100%;height:auto;}</style></head><body>
<p class="ey">Theoretical Property</p>
<p class="ti">Gauge Symmetry: Many Charts Represent the Same Function</p>
<p class="su">tensor rank is coordinate-dependent, the encoder minimises rank, not geometric distortion</p>
<svg viewBox="0 0 760 400" style="width:760px;max-width:100%;"><defs>
  <marker id="ah" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><path d="M0,0.5 L7,3 L0,5.5 L1.5,3Z" fill="var(--muted)" opacity="0.7"/></marker>
  <marker id="ahr" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><path d="M0,0.5 L7,3 L0,5.5 L1.5,3Z" fill="var(--primary)"/></marker>
  <filter id="cs"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/></filter>
</defs>
<rect width="760" height="400" fill="var(--bg)"/>

<!-- Three panels side by side: Cartesian, Polar (task-optimal), Rotated 45° -->
<!-- Each shows f(x,y) = e^{-(x²+y²)} in that coordinate system as contour plot -->
<!-- The key: rank and separability changes per chart, not the function -->

<!-- Panel shared structure -->
<!-- Panel 1: Cartesian (rank-1, coincidentally) -->
<rect x="12" y="12" width="226" height="350" rx="12" fill="var(--bg-alt)" stroke="var(--border)" stroke-width="1" filter="url(#cs)"/>
<line x1="20" y1="12" x2="230" y2="12" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round"/>
<text x="125" y="36" font-family="'Source Sans Pro',sans-serif" font-size="13" fill="var(--text)" text-anchor="middle">Cartesian (x,y)</text>
<text x="125" y="50" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--muted)" text-anchor="middle">f = exp(−x²) · exp(−y²)</text>

<!-- Circular contours (Cartesian Gaussian is separable) -->
<rect x="22" y="60" width="207" height="207" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8"/>
<!-- Radial gradient simulating Gaussian -->
<defs>
  <radialGradient id="g1" cx="50%" cy="50%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".65"/>
    <stop offset="40%" stop-color="#3b82f6" stop-opacity=".18"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".02"/></radialGradient>
</defs>
<rect x="22" y="60" width="207" height="207" fill="url(#g1)" rx="4"/>
<!-- Circular contours -->
<circle cx="125" cy="163" r="16" fill="none" stroke="var(--blue)" stroke-opacity=".8" stroke-width="1.3"/>
<circle cx="125" cy="163" r="34" fill="none" stroke="var(--blue)" stroke-opacity=".55" stroke-width="1.1"/>
<circle cx="125" cy="163" r="54" fill="none" stroke="var(--blue)" stroke-opacity=".35" stroke-width="1"/>
<circle cx="125" cy="163" r="76" fill="none" stroke="var(--blue)" stroke-opacity=".18" stroke-width=".9"/>
<circle cx="125" cy="163" r="96" fill="none" stroke="var(--blue)" stroke-opacity=".1" stroke-width=".8"/>
<!-- Axis-aligned crosshairs (showing separability) -->
<line x1="125" y1="60" x2="125" y2="267" stroke="var(--blue)" stroke-width="1.3" stroke-dasharray="4 3" opacity=".4"/>
<line x1="22" y1="163" x2="229" y2="163" stroke="var(--blue)" stroke-width="1.3" stroke-dasharray="4 3" opacity=".4"/>
<circle cx="125" cy="163" r="3.5" fill="var(--text)" opacity=".6"/>
<!-- Axis labels -->
<text x="224" y="167" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--muted)">x</text>
<text x="128" y="72" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--muted)">y</text>
<!-- Rank badge -->
<rect x="28" y="282" width="200" height="36" rx="7" fill="var(--green)" fill-opacity=".08" stroke="var(--green)" stroke-opacity=".35" stroke-width="1"/>
<text x="128" y="297" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--green)" text-anchor="middle" font-weight="600">Rank 1 ✓</text>
<text x="128" y="311" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--muted)" text-anchor="middle">exp(−x²) · exp(−y²) separable</text>
<text x="125" y="353" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--muted)" text-anchor="middle">axis-aligned contours</text>

<!-- Panel 2: Polar (task-optimal, explicitly rank-1 in r coordinate) -->
<rect x="268" y="12" width="226" height="350" rx="12" fill="var(--bg-alt)" stroke="var(--border)" stroke-width="1" filter="url(#cs)"/>
<line x1="276" y1="12" x2="486" y2="12" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round"/>
<text x="381" y="36" font-family="'Source Sans Pro',sans-serif" font-size="13" fill="var(--text)" text-anchor="middle">Polar (r, θ)</text>
<text x="381" y="50" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--muted)" text-anchor="middle">f = exp(−r²) · 1  (rank-1)</text>

<!-- In polar chart: r on x-axis, theta on y-axis -->
<!-- f depends only on r → iso-contours are vertical lines (pure r-dependence) -->
<rect x="278" y="60" width="207" height="207" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8"/>
<!-- Gradient along r-axis (horizontal) -->
<defs>
  <linearGradient id="g2polar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#10b981" stop-opacity=".6"/>
    <stop offset="40%" stop-color="#10b981" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#10b981" stop-opacity=".02"/>
  </linearGradient>
</defs>
<rect x="278" y="60" width="207" height="207" fill="url(#g2polar)" rx="4"/>
<!-- VERTICAL iso-contours, depend only on r, not on θ -->
<line x1="320" y1="60" x2="320" y2="267" stroke="var(--green)" stroke-opacity=".8" stroke-width="1.3"/>
<line x1="352" y1="60" x2="352" y2="267" stroke="var(--green)" stroke-opacity=".55" stroke-width="1.1"/>
<line x1="388" y1="60" x2="388" y2="267" stroke="var(--green)" stroke-opacity=".38" stroke-width="1"/>
<line x1="428" y1="60" x2="428" y2="267" stroke="var(--green)" stroke-opacity=".22" stroke-width=".9"/>
<line x1="468" y1="60" x2="468" y2="267" stroke="var(--green)" stroke-opacity=".12" stroke-width=".8"/>
<!-- Star marker showing independence of θ -->
<line x1="278" y1="163" x2="485" y2="163" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".4"/>
<!-- Labels -->
<text x="484" y="167" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--muted)">r</text>
<text x="281" y="72" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--muted)">θ</text>
<!-- θ-independence note -->
<text x="381" y="235" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--green)" text-anchor="middle" opacity=".9">↑ no θ dependence</text>
<!-- Rank badge -->
<rect x="284" y="282" width="200" height="36" rx="7" fill="var(--green)" fill-opacity=".12" stroke="var(--green)" stroke-opacity=".5" stroke-width="1"/>
<text x="384" y="297" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--green)" text-anchor="middle" font-weight="600">Rank 1 ★ (task-optimal)</text>
<text x="384" y="311" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--muted)" text-anchor="middle">exp(−r²) · const, IGL finds this</text>
<text x="381" y="353" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--green)" text-anchor="middle" font-weight="500">vertical iso-contours, only r matters</text>

<!-- Panel 3: Rotated 45° (requires cross-terms → rank 2+) -->
<rect x="524" y="12" width="226" height="350" rx="12" fill="var(--bg-alt)" stroke="var(--border)" stroke-width="1" filter="url(#cs)"/>
<line x1="532" y1="12" x2="742" y2="12" stroke="var(--amber)" stroke-width="2.5" stroke-linecap="round"/>
<text x="637" y="36" font-family="'Source Sans Pro',sans-serif" font-size="13" fill="var(--text)" text-anchor="middle">Rotated 45° (u,v)</text>
<text x="637" y="50" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--muted)" text-anchor="middle">f = exp(−u² − v² − √2·uv)</text>

<!-- Tilted contours (cross-term uv couples the axes) -->
<rect x="534" y="60" width="207" height="207" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="0.8"/>
<defs>
  <radialGradient id="g3" cx="50%" cy="50%"><stop offset="0%" stop-color="#f59e0b" stop-opacity=".65"/>
    <stop offset="40%" stop-color="#f59e0b" stop-opacity=".18"/><stop offset="100%" stop-color="#f59e0b" stop-opacity=".02"/></radialGradient>
</defs>
<rect x="534" y="60" width="207" height="207" fill="url(#g3)" rx="4"/>
<!-- TILTED ellipse contours, cross-term means they're no longer axis-aligned -->
<ellipse cx="637" cy="163" rx="16" ry="22" transform="rotate(45 637 163)" fill="none" stroke="var(--amber)" stroke-opacity=".85" stroke-width="1.3"/>
<ellipse cx="637" cy="163" rx="34" ry="46" transform="rotate(45 637 163)" fill="none" stroke="var(--amber)" stroke-opacity=".55" stroke-width="1.1"/>
<ellipse cx="637" cy="163" rx="54" ry="70" transform="rotate(45 637 163)" fill="none" stroke="var(--amber)" stroke-opacity=".35" stroke-width="1"/>
<ellipse cx="637" cy="163" rx="70" ry="90" transform="rotate(45 637 163)" fill="none" stroke="var(--amber)" stroke-opacity=".18" stroke-width=".9"/>
<!-- Show axis-aligned lines DON'T match the tilted contours -->
<line x1="637" y1="60" x2="637" y2="267" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" opacity=".25"/>
<line x1="534" y1="163" x2="741" y2="163" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" opacity=".25"/>
<circle cx="637" cy="163" r="3.5" fill="var(--text)" opacity=".6"/>
<!-- NOT-aligned annotation -->
<text x="534" y="72" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--amber)">u</text>
<text x="740" y="167" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--amber)">v</text>
<path d="M 660,113 L 668,98" stroke="var(--amber)" stroke-width="1" stroke-dasharray="3 2"/>
<text x="672" y="96" font-family="'Source Sans Pro',sans-serif" font-size="9" fill="var(--amber)">tilted ✗</text>
<!-- Rank badge -->
<rect x="540" y="282" width="200" height="36" rx="7" fill="var(--amber)" fill-opacity=".07" stroke="var(--amber)" stroke-opacity=".3" stroke-width="1"/>
<text x="640" y="297" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--amber)" text-anchor="middle" font-weight="600">Rank ≥ 2</text>
<text x="640" y="311" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--muted)" text-anchor="middle">cross-term √2·uv couples axes</text>
<text x="637" y="353" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--amber)" text-anchor="middle">tilted iso-contours, axes are coupled</text>

<!-- ─── Bottom strip ─── -->
<rect x="12" y="370" width="736" height="24" rx="6" fill="var(--bg-alt)" stroke="var(--border)" stroke-width="1"/>
<text x="380" y="386" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--muted)" text-anchor="middle">Gauge symmetry: any diffeomorphism Ψ is valid, IGL learns the chart that minimises source tensor rank</text>
</svg>
</body></html>
