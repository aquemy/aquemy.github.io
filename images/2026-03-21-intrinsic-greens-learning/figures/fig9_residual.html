<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResIGL Topology</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#f9f9f9;--bg-alt:#fff;--text:#171717;--muted:#666;--border:#e2e8f0;
  --border-strong:#cbd5e1;--primary:#A51209;--blue:#3b82f6;--green:#10b981;
  --amber:#f59e0b;--purple:#8b5cf6;--red:#ef4444;}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--bg-alt:#171717;--text:#e2e2e2;--muted:#888;--border:#374151;--border-strong:#4b5563;}}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Inter',sans-serif;display:flex;flex-direction:column;
  align-items:center;padding:28px 20px 22px;}
.ey{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-bottom:5px;}
.ti{font-size:20px;font-weight:600;color:var(--text);text-align:center;margin-bottom:3px;}
.su{font-size:13px;color:var(--muted);text-align:center;margin-bottom:18px;}
.cap{margin-top:14px;font-size:12.5px;color:var(--muted);max-width:700px;text-align:center;line-height:1.7;}
.cap em{color:var(--text);font-style:normal;font-weight:500;}
svg{display:block;max-width:100%;height:auto;}</style></head><body>
<p class="ey">Architecture</p>
<p class="ti">ResIGL: IGL as Geometric Scaffold + MLP Residual</p>
<p class="su">pure MLP iso-curves tangle near discontinuities, ResIGL keeps them stratified</p>
<svg viewBox="0 0 760 430" style="width:760px;max-width:100%;"><defs>
  <filter id="cs"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.07"/></filter>
</defs>
<rect width="760" height="430" fill="var(--bg)"/>

<!-- LEFT: Pure MLP -->
<rect x="14" y="14" width="350" height="300" rx="12" fill="var(--bg-alt)" stroke="var(--border)" stroke-width="1" filter="url(#cs)"/>
<line x1="22" y1="14" x2="356" y2="14" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round"/>
<text x="189" y="38" font-family="'Source Sans Pro',sans-serif" font-size="14" font-weight="600" fill="var(--text)" text-anchor="middle">Pure MLP</text>
<text x="189" y="53" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--muted)" text-anchor="middle">target: sign(sin(t)), discontinuous</text>

<!-- Background bands left -->
<rect x="28" y="62" width="322" height="72" rx="4" fill="var(--blue)" fill-opacity="0.08"/>
<rect x="28" y="134" width="322" height="72" rx="4" fill="var(--red)" fill-opacity="0.06"/>
<rect x="28" y="206" width="322" height="72" rx="4" fill="var(--blue)" fill-opacity="0.08"/>

<!-- MLP iso-curves: TANGLED -->
<g fill="none" stroke-linecap="round">
<!-- +1 region: wavy but ok -->
<path d="M 28,82 Q 90,88 140,78 Q 200,68 260,84 Q 310,96 350,80" stroke="var(--blue)" stroke-width="1.2" opacity="0.5"/>
<path d="M 28,108 Q 90,114 140,104 Q 200,94 260,110 Q 310,122 350,106" stroke="var(--blue)" stroke-width="1.2" opacity="0.5"/>
<!-- Boundary 1: tangled crossing -->
<path d="M 28,130 Q 80,118 120,138 Q 160,158 200,134 Q 240,110 280,132 Q 320,152 350,134" stroke="var(--red)" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.7"/>
<path d="M 28,142 Q 80,154 120,132 Q 160,110 200,140 Q 240,170 280,142 Q 320,114 350,140" stroke="var(--red)" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.7"/>
<!-- -1 region: messy -->
<path d="M 28,170 Q 90,178 140,166 Q 200,154 260,172 Q 310,186 350,168" stroke="var(--red)" stroke-width="1.2" opacity="0.45"/>
<!-- Boundary 2: tangled -->
<path d="M 28,200 Q 80,188 120,208 Q 160,228 200,204 Q 240,180 280,202 Q 320,222 350,204" stroke="var(--red)" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.7"/>
<path d="M 28,212 Q 80,224 120,202 Q 160,180 200,210 Q 240,240 280,212 Q 320,184 350,210" stroke="var(--red)" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.7"/>
<!-- +1 region bottom -->
<path d="M 28,240 Q 90,248 140,236 Q 200,224 260,242 Q 310,256 350,238" stroke="var(--blue)" stroke-width="1.2" opacity="0.5"/>
<path d="M 28,262 Q 90,268 140,258 Q 200,248 260,264 Q 310,276 350,260" stroke="var(--blue)" stroke-width="1.2" opacity="0.5"/>
</g>

<!-- Annotation: curves cross -->
<rect x="220" y="282" width="120" height="22" rx="5" fill="var(--red)" fill-opacity="0.08" stroke="var(--red)" stroke-opacity="0.4" stroke-width="1"/>
<text x="280" y="297" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--red)" text-anchor="middle" font-weight="500">iso-curves cross ✗</text>

<!-- RIGHT: ResIGL -->
<rect x="396" y="14" width="350" height="300" rx="12" fill="var(--bg-alt)" stroke="var(--border)" stroke-width="1" filter="url(#cs)"/>
<line x1="404" y1="14" x2="738" y2="14" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round"/>
<text x="571" y="38" font-family="'Source Sans Pro',sans-serif" font-size="14" font-weight="600" fill="var(--text)" text-anchor="middle">ResIGL (IGL + MLP residual)</text>
<text x="571" y="53" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--muted)" text-anchor="middle">IGL scaffold preserves topology</text>

<!-- Background bands right -->
<rect x="410" y="62" width="322" height="72" rx="4" fill="var(--blue)" fill-opacity="0.08"/>
<rect x="410" y="134" width="322" height="72" rx="4" fill="var(--red)" fill-opacity="0.06"/>
<rect x="410" y="206" width="322" height="72" rx="4" fill="var(--blue)" fill-opacity="0.08"/>

<!-- ResIGL iso-curves: STRATIFIED (clean parallel) -->
<g fill="none" stroke-linecap="round">
<path d="M 410,80 L 732,80" stroke="var(--blue)" stroke-width="1.2" opacity="0.5"/>
<path d="M 410,100 L 732,100" stroke="var(--blue)" stroke-width="1.2" opacity="0.5"/>
<path d="M 410,120 L 732,120" stroke="var(--blue)" stroke-width="1.2" opacity="0.5"/>
<!-- Crisp boundary -->
<path d="M 410,134 L 732,134" stroke="var(--text)" stroke-width="2.5" opacity="0.3"/>
<!-- -1 region -->
<path d="M 410,154 L 732,154" stroke="var(--red)" stroke-width="1.2" opacity="0.45"/>
<path d="M 410,170 L 732,170" stroke="var(--red)" stroke-width="1.2" opacity="0.45"/>
<path d="M 410,186 L 732,186" stroke="var(--red)" stroke-width="1.2" opacity="0.45"/>
<!-- Crisp boundary -->
<path d="M 410,206 L 732,206" stroke="var(--text)" stroke-width="2.5" opacity="0.3"/>
<!-- +1 region bottom -->
<path d="M 410,226 L 732,226" stroke="var(--blue)" stroke-width="1.2" opacity="0.5"/>
<path d="M 410,248 L 732,248" stroke="var(--blue)" stroke-width="1.2" opacity="0.5"/>
<path d="M 410,268 L 732,268" stroke="var(--blue)" stroke-width="1.2" opacity="0.5"/>
</g>

<!-- Annotation: stratified -->
<rect x="600" y="282" width="108" height="22" rx="5" fill="var(--green)" fill-opacity="0.08" stroke="var(--green)" stroke-opacity="0.4" stroke-width="1"/>
<text x="654" y="297" font-family="'Source Sans Pro',sans-serif" font-size="10" fill="var(--green)" text-anchor="middle" font-weight="500">stratified ✓</text>

<!-- Formula bar -->
<rect x="14" y="330" width="732" height="44" rx="8" fill="var(--bg-alt)" stroke="var(--border)" stroke-width="1"/>
<text x="380" y="349" font-family="'Source Sans Pro',sans-serif" font-size="12" fill="var(--text)" text-anchor="middle" font-weight="600">ResIGL:  u(x) = ∫G(ξ,ζ)f(ζ)dζ  +  M(ξ)</text>
<text x="380" y="366" font-family="'Roboto Mono',monospace" font-size="10" fill="var(--muted)" text-anchor="middle">IGL branch: topology + global trend (few O(KR) params)  ·  MLP branch M(ξ): sharp residuals</text>

<!-- Bottom labels -->
<text x="189" y="398" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--muted)" text-anchor="middle">geometric collapse at discontinuity</text>
<text x="571" y="398" font-family="'Source Sans Pro',sans-serif" font-size="11" fill="var(--muted)" text-anchor="middle">topology preserved · MLP fits sharp transitions</text>
</svg>
</body></html>
