<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGL: From Token Embeddings to Intrinsic Coordinates</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Source Sans Pro',sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 12px;}
.ti{font-size:20px;font-weight:700;color:var(--text);text-align:center;margin-bottom:14px;}
svg{display:block;max-width:100%;height:auto;}
</style></head><body>
<p class="ti">IGL: Single Global Chart with Operator-Conditioned Readout</p>
<svg viewBox="0 0 900 620" style="width:900px;max-width:100%;">
<rect width="900" height="620" fill="var(--bg)" rx="6"/>

<polygon points="507,157 507,171 520,164" fill="var(--green)"/>
<text x="445" y="150" font-family="'Source Sans Pro'" font-size="15" fill="var(--green)" text-anchor="middle" font-weight="700">Encoder Ψ<tspan baseline-shift="sub" font-size="10">θ</tspan></text>
<text x="445" y="186" font-family="'Roboto Mono'" font-size="10" fill="var(--muted)" text-anchor="middle">MLP: ℝ<tspan baseline-shift="super" font-size="8">D</tspan> → ℝ<tspan baseline-shift="super" font-size="8">d</tspan></text>

<!-- ════════════════════════════════════════════════ -->
<!-- PANEL (B): Latent / Intrinsic Coordinates       -->
<!-- ════════════════════════════════════════════════ -->
<text x="540" y="24" font-family="'Source Sans Pro'" font-size="16" fill="var(--text)" font-weight="700">(B) Intrinsic Coordinates ℝ<tspan baseline-shift="super" font-size="11">d</tspan></text>

<rect x="540" y="34" width="340" height="260" rx="10" fill="var(--bg-alt)" stroke="var(--amber)" stroke-opacity="0.4" stroke-width="1.4"/>
<text x="830" y="56" font-family="'Roboto Mono'" font-size="10" fill="var(--amber)" text-anchor="end">d_max = 128</text>

<!-- Axes -->
<line x1="570" y1="270" x2="570" y2="50" stroke="var(--muted)" stroke-width="1"/>

<polygon points="856,267 856,273 864,270" fill="var(--muted)"/>
<text x="868" y="274" font-family="'Roboto Mono'" font-size="10" fill="var(--muted)">z₁</text>

<!-- Anchor grid (×) -->
<text x="610" y="78" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>
<text x="670" y="78" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>
<text x="730" y="78" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>
<text x="790" y="78" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>
<text x="840" y="78" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>

<text x="610" y="130" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>
<text x="670" y="130" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>
<text x="730" y="130" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>

<text x="840" y="130" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>

<text x="610" y="182" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>
<text x="670" y="182" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>
<text x="790" y="182" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>
<text x="840" y="182" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>

<text x="610" y="234" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>
<text x="670" y="234" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>
<text x="730" y="234" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>

<text x="840" y="234" font-family="'Roboto Mono'" font-size="13" fill="var(--primary)" text-anchor="middle">×</text>

<!-- Concentric circles: kernel basis evaluation -->
<circle cx="730" cy="170" r="22" fill="none" stroke="var(--purple)" stroke-opacity="0.15" stroke-width="1"/>
<circle cx="730" cy="170" r="44" fill="none" stroke="var(--purple)" stroke-opacity="0.1" stroke-width="1"/>
<circle cx="730" cy="170" r="66" fill="none" stroke="var(--purple)" stroke-opacity="0.06" stroke-width="1"/>

<!-- Mapped token dots (green) -->
<circle cx="640" cy="210" r="4.5" fill="var(--green)"/>
<text x="622" y="220" font-family="'Roboto Mono'" font-size="9" fill="var(--green)">z₁</text>

<circle cx="700" cy="145" r="4.5" fill="var(--green)"/>
<text x="700" y="138" font-family="'Roboto Mono'" font-size="9" fill="var(--green)">z₃</text>

<circle cx="800" cy="158" r="4.5" fill="var(--green)"/>
<text x="810" y="156" font-family="'Roboto Mono'" font-size="9" fill="var(--green)">z₆</text>

<circle cx="660" cy="170" r="3.5" fill="var(--green)"/>
<circle cx="720" cy="190" r="3.5" fill="var(--green)"/>
<circle cx="750" cy="115" r="3.5" fill="var(--green)"/>
<circle cx="680" cy="100" r="3.5" fill="var(--green)"/>
<circle cx="770" cy="200" r="3.5" fill="var(--green)"/>
<circle cx="620" cy="150" r="3.5" fill="var(--green)"/>
<circle cx="740" cy="160" r="3.5" fill="var(--green)"/>
<circle cx="710" cy="210" r="3.5" fill="var(--green)"/>
<circle cx="780" cy="110" r="3.5" fill="var(--green)"/>

<!-- Anchor label -->
<text x="730" y="258" font-family="'Roboto Mono'" font-size="10" fill="var(--primary)" text-anchor="middle">θ_r (anchor grid)</text>

<!-- ════════════════════════════════════════════════ -->
<!-- PANEL (C): Single Chart vs Multi-Chart          -->
<!-- ════════════════════════════════════════════════ -->
<line x1="20" y1="316" x2="880" y2="316" stroke="var(--border)" stroke-width="1"/>
<text x="20" y="344" font-family="'Source Sans Pro'" font-size="16" fill="var(--text)" font-weight="700">(C) One Global Chart vs. Atlas: Multiple Charts</text>

<!-- Left: IGL Single Chart -->
<text x="140" y="372" font-family="'Source Sans Pro'" font-size="13" fill="var(--blue)" text-anchor="middle" font-weight="700">One Global Chart</text>

<!-- Blob -->
<path d="M 70,410 C 85,390 140,380 190,395 C 230,405 240,430 225,455 C 210,475 150,480 110,470 C 70,460 55,435 70,410 Z" fill="var(--blue)" fill-opacity="0.08" stroke="var(--blue)" stroke-opacity="0.3" stroke-width="1.2"/>
<line x1="140" y1="485" x2="140" y2="505" stroke="var(--green)" stroke-width="1.5"/>
<polygon points="136,503 144,503 140,510" fill="var(--green)"/>
<text x="140" y="524" font-family="'Roboto Mono'" font-size="9" fill="var(--muted)" text-anchor="middle">Ψ: M → ℝ<tspan baseline-shift="super" font-size="7">d</tspan></text>

<!-- Single coordinate box -->
<rect x="80" y="534" width="120" height="40" rx="6" fill="var(--bg-alt)" stroke="var(--blue)" stroke-opacity="0.3" stroke-width="1"/>
<line x1="100" y1="568" x2="100" y2="542" stroke="var(--muted)" stroke-width="0.8"/>
<polygon points="98,544 102,544 100,540" fill="var(--muted)"/>
<line x1="86" y1="560" x2="180" y2="560" stroke="var(--muted)" stroke-width="0.8"/>
<polygon points="176,558 176,562 182,560" fill="var(--muted)"/>
<text x="140" y="590" font-family="'Source Sans Pro'" font-size="10" fill="var(--muted)" text-anchor="middle">Single coordinate system</text>

<!-- Center: MHALM Multi-Chart Atlas -->
<text x="450" y="372" font-family="'Source Sans Pro'" font-size="13" fill="var(--text)" text-anchor="middle" font-weight="700">Atlas: Three Global Charts</text>

<!-- Same manifold blob, covered entirely by all 3 charts -->
<path d="M 370,410 C 385,390 440,380 490,395 C 530,405 540,430 525,455 C 510,475 450,480 410,470 C 370,460 355,435 370,410 Z" fill="none" stroke="var(--muted)" stroke-opacity="0.2" stroke-width="1.2"/>

<!-- All three charts cover the ENTIRE manifold (global, not local) -->
<!-- Spherical chart (blue), full coverage, offset slightly for visibility -->
<path d="M 370,410 C 385,390 440,380 490,395 C 530,405 540,430 525,455 C 510,475 450,480 410,470 C 370,460 355,435 370,410 Z" fill="var(--blue)" fill-opacity="0.08" stroke="var(--blue)" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 2" transform="translate(-3,-3)"/>

<!-- Gabor chart (green), full coverage -->
<path d="M 370,410 C 385,390 440,380 490,395 C 530,405 540,430 525,455 C 510,475 450,480 410,470 C 370,460 355,435 370,410 Z" fill="var(--green)" fill-opacity="0.08" stroke="var(--green)" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 2"/>

<!-- Laplacian chart (amber), full coverage -->
<path d="M 370,410 C 385,390 440,380 490,395 C 530,405 540,430 525,455 C 510,475 450,480 410,470 C 370,460 355,435 370,410 Z" fill="var(--amber)" fill-opacity="0.08" stroke="var(--amber)" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 2" transform="translate(3,3)"/>

<!-- Arrows from the same manifold to 3 coordinate boxes -->
<line x1="430" y1="475" x2="370" y2="510" stroke="var(--blue)" stroke-width="1.2"/>
<polygon points="367,507 373,512 370,515" fill="var(--blue)"/>
<line x1="450" y1="475" x2="450" y2="510" stroke="var(--green)" stroke-width="1.2"/>
<polygon points="446,508 454,508 450,515" fill="var(--green)"/>
<line x1="470" y1="475" x2="530" y2="510" stroke="var(--amber)" stroke-width="1.2"/>
<polygon points="527,507 533,512 530,515" fill="var(--amber)"/>

<!-- 3 small coordinate boxes -->
<rect x="335" y="518" width="70" height="36" rx="5" fill="var(--blue)" fill-opacity="0.06" stroke="var(--blue)" stroke-opacity="0.25" stroke-width="1"/>
<text x="370" y="540" font-family="'Roboto Mono'" font-size="9" fill="var(--blue)" text-anchor="middle">Ψ₀</text>

<rect x="415" y="518" width="70" height="36" rx="5" fill="var(--green)" fill-opacity="0.06" stroke="var(--green)" stroke-opacity="0.25" stroke-width="1"/>
<text x="450" y="540" font-family="'Roboto Mono'" font-size="9" fill="var(--green)" text-anchor="middle">Ψ₁</text>

<rect x="495" y="518" width="70" height="36" rx="5" fill="var(--amber)" fill-opacity="0.06" stroke="var(--amber)" stroke-opacity="0.25" stroke-width="1"/>
<text x="530" y="540" font-family="'Roboto Mono'" font-size="9" fill="var(--amber)" text-anchor="middle">Ψ₂</text>

<text x="370" y="572" font-family="'Source Sans Pro'" font-size="9" fill="var(--blue)" text-anchor="middle">Chart 1</text>
<text x="450" y="572" font-family="'Source Sans Pro'" font-size="9" fill="var(--green)" text-anchor="middle">Chart 2</text>
<text x="530" y="572" font-family="'Source Sans Pro'" font-size="9" fill="var(--amber)" text-anchor="middle">Chart 3</text>

<text x="450" y="596" font-family="'Source Sans Pro'" font-size="10" fill="var(--muted)" text-anchor="middle">Three global charts, different views</text>

<!-- Right: Explanation box -->
<rect x="610" y="380" width="260" height="150" rx="8" fill="var(--bg-alt)" stroke="var(--border)" stroke-width="1.2"/>
<text x="630" y="403" font-family="'Source Sans Pro'" font-size="12" fill="var(--text)" font-weight="700">Why an Atlas?</text>
<text x="630" y="422" font-family="'Source Sans Pro'" font-size="10" fill="var(--muted)">
<tspan x="630" dy="0">Unlike a classical atlas, these charts</tspan>
<tspan x="630" dy="16">are not local, each one is global.</tspan>
<tspan x="630" dy="22" font-weight="600" fill="var(--text)">All three encoders see every token.</tspan>
<tspan x="630" dy="16">They differ in what they measure:</tspan>
<tspan x="630" dy="16">angles (Ψ₀), oscillations (Ψ₁),</tspan>
<tspan x="630" dy="16">or proximity (Ψ₂).</tspan>
</text>

</svg>
</body></html>
