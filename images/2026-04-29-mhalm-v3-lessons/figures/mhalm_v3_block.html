<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: transparent;
  }
  .diagram {
    max-width: 780px;
    margin: 0 auto;
    padding: 16px;
  }
  svg text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
</style>
</head>
<body>
<div class="diagram">
<svg viewBox="0 0 780 830" xmlns="http://www.w3.org/2000/svg">

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Inside a HybridAtlasBlock</text>

  <!-- Input -->
  <rect x="300" y="44" width="180" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="65" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Input x &#8712; R&#8309;&#185;&#178;</text>

  <line x1="390" y1="76" x2="390" y2="92" stroke="#475569" stroke-width="1.5"/>
  <polygon points="383,90 390,100 397,90" fill="#475569"/>

  <!-- STAGE 1: ENCODERS -->
  <rect x="40" y="104" width="700" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="124" font-size="12" font-weight="700" fill="#1d4ed8">STAGE 1, Chart Encoders</text>

  <rect x="60" y="134" width="200" height="72" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="160" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Encoder &#936;&#8320;</text>
  <text x="160" y="170" text-anchor="middle" font-size="10" fill="#1e40af">512 &#8594; 4&#215;SiLU &#8594; 160</text>
  <text x="160" y="186" text-anchor="middle" font-size="10" fill="#1e40af">tanh(z/&#964;) &#183; Stiefel</text>
  <text x="160" y="200" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">&#8594; z&#8320;</text>

  <rect x="290" y="134" width="200" height="72" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="390" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Encoder &#936;&#8321;</text>
  <text x="390" y="170" text-anchor="middle" font-size="10" fill="#1e40af">512 &#8594; 4&#215;SiLU &#8594; 160</text>
  <text x="390" y="186" text-anchor="middle" font-size="10" fill="#1e40af">tanh(z/&#964;) &#183; Stiefel</text>
  <text x="390" y="200" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">&#8594; z&#8321;</text>

  <rect x="520" y="134" width="200" height="72" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="620" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Encoder &#936;&#8322;</text>
  <text x="620" y="170" text-anchor="middle" font-size="10" fill="#1e40af">512 &#8594; 4&#215;SiLU &#8594; 160</text>
  <text x="620" y="186" text-anchor="middle" font-size="10" fill="#1e40af">tanh(z/&#964;) &#183; Stiefel</text>
  <text x="620" y="200" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">&#8594; z&#8322;</text>

  <!-- === ROUTING ZONE === -->
  <!-- Two labeled arrows going straight down from the Stage 1 box -->

  <!-- Left arrow: z_cat to temporal -->
  <line x1="200" y1="224" x2="200" y2="280" stroke="#22c55e" stroke-width="2"/>
  <polygon points="193,278 200,288 207,278" fill="#22c55e"/>
  <rect x="110" y="238" width="180" height="20" rx="4" fill="#e0e7ff" stroke="#818cf8" stroke-width="1"/>
  <text x="200" y="252" text-anchor="middle" font-size="10" font-weight="600" fill="#4338ca">z_cat = [z&#8320;,z&#8321;,z&#8322;] &#8712; R&#8308;&#8312;&#8304;</text>

  <!-- Right arrow: individual z's to spatial -->
  <line x1="580" y1="224" x2="580" y2="280" stroke="#eab308" stroke-width="2"/>
  <polygon points="573,278 580,288 587,278" fill="#eab308"/>
  <rect x="490" y="238" width="180" height="20" rx="4" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
  <text x="580" y="252" text-anchor="middle" font-size="10" font-weight="600" fill="#a16207">z&#8320;, z&#8321;, z&#8322; individually</text>

  <!-- ====== LEFT: TEMPORAL PATH ====== -->
  <rect x="40" y="294" width="360" height="290" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="60" y="316" font-size="12" font-weight="700" fill="#15803d">TEMPORAL PATH</text>
  <text x="60" y="332" font-size="10" fill="#15803d">on z_cat (all 3 encoders concatenated)</text>

  <!-- Pass 1 -->
  <rect x="60" y="344" width="320" height="96" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="220" y="362" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Pass 1</text>

  <rect x="78" y="370" width="120" height="52" rx="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="138" y="390" text-anchor="middle" font-size="10.5" font-weight="600" fill="#14532d">FFT SSM</text>
  <text x="138" y="404" text-anchor="middle" font-size="9" fill="#166534">cuFFT &#183; Weyl init</text>
  <text x="138" y="416" text-anchor="middle" font-size="9" fill="#166534">O(T log T)</text>

  <text x="208" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#16a34a">&#8214;</text>

  <rect x="220" y="370" width="140" height="52" rx="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="290" y="390" text-anchor="middle" font-size="10.5" font-weight="600" fill="#14532d">Attention</text>
  <text x="290" y="404" text-anchor="middle" font-size="9" fill="#166534">8 heads &#183; RoPE &#183; XSA</text>
  <text x="290" y="416" text-anchor="middle" font-size="9" fill="#166534">2 layers</text>

  <rect x="110" y="426" width="220" height="16" rx="3" fill="#86efac" stroke="#22c55e" stroke-width="1"/>
  <text x="220" y="438" text-anchor="middle" font-size="9" font-weight="600" fill="#14532d">&#963;(g) &#183; SSM + (1-&#963;) &#183; Attn</text>

  <!-- Arrow to pass 2 -->
  <line x1="220" y1="442" x2="220" y2="456" stroke="#475569" stroke-width="1.5"/>
  <polygon points="213,454 220,464 227,454" fill="#475569"/>

  <!-- Pass 2 -->
  <rect x="60" y="466" width="320" height="46" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="220" y="486" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Pass 2 (refinement)</text>
  <text x="220" y="502" text-anchor="middle" font-size="9.5" fill="#166534">Same SSM &#8214; Attn, independent weights, on residual</text>

  <!-- Temporal output -->
  <line x1="220" y1="512" x2="220" y2="536" stroke="#475569" stroke-width="1.5"/>
  <polygon points="213,534 220,544 227,534" fill="#475569"/>
  <rect x="130" y="548" width="180" height="24" rx="5" fill="#86efac" stroke="#16a34a" stroke-width="1.2"/>
  <text x="220" y="565" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">H_temporal &#8712; R&#178;&#8309;&#8310;</text>

  <!-- ====== RIGHT: SPATIAL PATH ====== -->
  <rect x="420" y="294" width="320" height="262" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="440" y="316" font-size="12" font-weight="700" fill="#a16207">SPATIAL PATH</text>
  <text x="440" y="332" font-size="10" fill="#a16207">Each encoder &#8594; its dedicated kernel head</text>

  <!-- All 5 heads in a single evenly-spaced row -->
  <!-- Box width=52, gap=6, 5 boxes = 5*52+4*6 = 284. Start at x=438 -->
  <rect x="438" y="344" width="52" height="64" rx="5" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="464" y="358" text-anchor="middle" font-size="9" font-weight="600" fill="#854d0e">Nystrom</text>
  <text x="464" y="372" text-anchor="middle" font-size="7.5" fill="#92400e">&#936;&#8320; &#8594; z&#8320;</text>
  <text x="464" y="384" text-anchor="middle" font-size="7.5" fill="#92400e">Gegenbauer</text>
  <text x="464" y="396" text-anchor="middle" font-size="7.5" fill="#92400e">R=256</text>

  <rect x="496" y="344" width="52" height="64" rx="5" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="522" y="358" text-anchor="middle" font-size="9" font-weight="600" fill="#854d0e">Gabor</text>
  <text x="522" y="372" text-anchor="middle" font-size="7.5" fill="#92400e">&#936;&#8321; &#8594; z&#8321;</text>
  <text x="522" y="384" text-anchor="middle" font-size="7.5" fill="#92400e">Gauss&#215;cos</text>
  <text x="522" y="396" text-anchor="middle" font-size="7.5" fill="#92400e">R=256</text>

  <rect x="554" y="344" width="52" height="64" rx="5" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="580" y="358" text-anchor="middle" font-size="9" font-weight="600" fill="#854d0e">Laplacian</text>
  <text x="580" y="372" text-anchor="middle" font-size="7.5" fill="#92400e">&#936;&#8322; &#8594; z&#8322;</text>
  <text x="580" y="384" text-anchor="middle" font-size="7.5" fill="#92400e">RBF mix</text>
  <text x="580" y="396" text-anchor="middle" font-size="7.5" fill="#92400e">R=256</text>

  <rect x="612" y="344" width="52" height="64" rx="5" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="638" y="358" text-anchor="middle" font-size="9" font-weight="600" fill="#854d0e">Tucker</text>
  <text x="638" y="372" text-anchor="middle" font-size="7.5" fill="#92400e">z&#8321;&#215;z&#8322;</text>
  <text x="638" y="384" text-anchor="middle" font-size="7.5" fill="#92400e">cross-enc</text>
  <text x="638" y="396" text-anchor="middle" font-size="7.5" fill="#92400e">R=256</text>

  <rect x="670" y="344" width="52" height="64" rx="5" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="696" y="358" text-anchor="middle" font-size="9" font-weight="600" fill="#854d0e">Linear</text>
  <text x="696" y="372" text-anchor="middle" font-size="7.5" fill="#92400e">&#936;&#8320; &#8594; z&#8320;</text>
  <text x="696" y="384" text-anchor="middle" font-size="7.5" fill="#92400e">raw (no K)</text>
  <text x="696" y="396" text-anchor="middle" font-size="7.5" fill="#92400e">d=160</text>

  <!-- Connector lines from all 5 heads to horizontal bar -->
  <line x1="464" y1="408" x2="464" y2="428" stroke="#92400e" stroke-width="1"/>
  <line x1="522" y1="408" x2="522" y2="428" stroke="#92400e" stroke-width="1"/>
  <line x1="580" y1="408" x2="580" y2="428" stroke="#92400e" stroke-width="1"/>
  <line x1="638" y1="408" x2="638" y2="428" stroke="#92400e" stroke-width="1"/>
  <line x1="696" y1="408" x2="696" y2="428" stroke="#92400e" stroke-width="1"/>
  <!-- Horizontal bar -->
  <line x1="464" y1="428" x2="696" y2="428" stroke="#92400e" stroke-width="1.2"/>
  <!-- Single line down to GEMM -->
  <line x1="580" y1="428" x2="580" y2="448" stroke="#475569" stroke-width="1.5"/>
  <polygon points="573,446 580,456 587,446" fill="#475569"/>

  <!-- Stacked GEMM -->
  <rect x="455" y="460" width="250" height="32" rx="6" fill="#fae8ff" stroke="#c026d3" stroke-width="1.2"/>
  <text x="580" y="476" text-anchor="middle" font-size="10" font-weight="600" fill="#86198f">Stacked GEMM &#183; HeadScaler</text>
  <text x="580" y="488" text-anchor="middle" font-size="9" fill="#a21caf">&#934;_all &#183; W_all &#8594; mixed</text>

  <!-- Spatial output -->
  <line x1="580" y1="492" x2="580" y2="510" stroke="#475569" stroke-width="1.5"/>
  <polygon points="573,508 580,518 587,508" fill="#475569"/>
  <rect x="490" y="520" width="180" height="24" rx="5" fill="#fde68a" stroke="#eab308" stroke-width="1.2"/>
  <text x="580" y="537" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">mixed &#8712; R&#185;&#8304;&#178;&#8308;</text>

  <!-- ====== COMBINATION ====== -->
  <line x1="220" y1="572" x2="220" y2="600" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="580" y1="544" x2="580" y2="600" stroke="#eab308" stroke-width="1.5"/>
  <line x1="220" y1="600" x2="580" y2="600" stroke="#475569" stroke-width="1.5"/>
  <line x1="390" y1="600" x2="390" y2="620" stroke="#475569" stroke-width="1.5"/>
  <polygon points="383,618 390,628 397,618" fill="#475569"/>

  <rect x="160" y="630" width="460" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="390" y="648" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">logits = W_out(H_temporal) &#183; E&#7488; + &#947; &#215; mixed</text>
  <text x="390" y="662" text-anchor="middle" font-size="9.5" fill="#64748b">&#947; init=0: temporal first, spatial opens gradually</text>

  <rect x="160" y="686" width="460" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="390" y="702" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">mixed is accumulated across both blocks;</text>
  <text x="390" y="716" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">combination happens at the model output, not inside each block</text>

</svg>
</div>
</body>
</html>
