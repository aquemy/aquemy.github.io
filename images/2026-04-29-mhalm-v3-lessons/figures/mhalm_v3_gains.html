<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: transparent;
  }
  .diagram {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
  }
  svg text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
</style>
</head>
<body>
<div class="diagram">
<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg">

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">V1 &#8594; V2 Improvement Attribution (est_bpb)</text>

  <!-- Legend -->
  <rect x="510" y="38" width="200" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="522" y="50" width="12" height="12" rx="2" fill="#fbbf24"/>
  <text x="540" y="61" font-size="10.5" fill="#475569">Bug fix</text>
  <rect x="598" y="50" width="12" height="12" rx="2" fill="#818cf8"/>
  <text x="616" y="61" font-size="10.5" fill="#475569">Architecture</text>
  <rect x="522" y="68" width="12" height="12" rx="2" fill="#94a3b8"/>
  <text x="540" y="79" font-size="10.5" fill="#475569">Engineering</text>

  <!-- Vertical axis -->
  <line x1="220" y1="108" x2="220" y2="302" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Scale gridlines: max is 0.065, use 400px = 0.065 → 1 bpb = 6154px -->
  <line x1="328" y1="108" x2="328" y2="302" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="328" y="318" text-anchor="middle" font-size="9" fill="#94a3b8">-0.02</text>
  <line x1="435" y1="108" x2="435" y2="302" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="435" y="318" text-anchor="middle" font-size="9" fill="#94a3b8">-0.04</text>
  <line x1="543" y1="108" x2="543" y2="302" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="543" y="318" text-anchor="middle" font-size="9" fill="#94a3b8">-0.06</text>
  <text x="220" y="318" text-anchor="middle" font-size="9" fill="#94a3b8">0</text>

  <!-- Axis label -->
  <text x="400" y="336" text-anchor="middle" font-size="11" fill="#64748b">est_bpb reduction (competition metric)</text>

  <!-- Bars: scale 400px = 0.065 bpb, so multiply by 6154 -->

  <!-- Stiefel fix: 0.065 = 400px — Bug fix -->
  <rect x="220" y="112" width="400" height="26" rx="4" fill="#fbbf24" opacity="0.85"/>
  <text x="214" y="130" text-anchor="end" font-size="11" fill="#334155">Stiefel fix</text>
  <text x="626" y="130" text-anchor="start" font-size="10" font-weight="600" fill="#92400e">-0.065</text>

  <!-- Weyl init: 0.062 = 382px — Architecture -->
  <rect x="220" y="142" width="382" height="26" rx="4" fill="#818cf8" opacity="0.85"/>
  <text x="214" y="160" text-anchor="end" font-size="11" fill="#334155">Weyl spectral init</text>
  <text x="608" y="160" text-anchor="start" font-size="10" font-weight="600" fill="#4338ca">-0.062</text>

  <!-- d_max: 0.036 = 222px — Engineering -->
  <rect x="220" y="172" width="222" height="26" rx="4" fill="#94a3b8" opacity="0.85"/>
  <text x="214" y="190" text-anchor="end" font-size="11" fill="#334155">d_max 128&#8594;160</text>
  <text x="448" y="190" text-anchor="start" font-size="10" font-weight="600" fill="#475569">-0.036</text>

  <!-- z-space processing: 0.034 = 209px — Architecture -->
  <rect x="220" y="202" width="209" height="26" rx="4" fill="#818cf8" opacity="0.85"/>
  <text x="214" y="220" text-anchor="end" font-size="11" fill="#334155">z-space processing</text>
  <text x="435" y="220" text-anchor="start" font-size="10" font-weight="600" fill="#4338ca">-0.034</text>

  <!-- FFT SSM: 0.031 = 191px — Engineering -->
  <rect x="220" y="232" width="191" height="26" rx="4" fill="#94a3b8" opacity="0.85"/>
  <text x="214" y="250" text-anchor="end" font-size="11" fill="#334155">FFT SSM (cuFFT)</text>
  <text x="417" y="250" text-anchor="start" font-size="10" font-weight="600" fill="#475569">-0.031</text>

  <!-- Muon routing: 0.022 = 135px — Engineering -->
  <rect x="220" y="262" width="135" height="26" rx="4" fill="#94a3b8" opacity="0.85"/>
  <text x="214" y="280" text-anchor="end" font-size="11" fill="#334155">Muon routing</text>
  <text x="361" y="280" text-anchor="start" font-size="10" font-weight="600" fill="#475569">-0.022</text>

  <!-- torch.compile: 0.005 = 31px — Engineering -->
  <rect x="220" y="292" width="31" height="26" rx="4" fill="#94a3b8" opacity="0.85"/>
  <text x="214" y="310" text-anchor="end" font-size="11" fill="#334155">torch.compile</text>
  <text x="257" y="310" text-anchor="start" font-size="10" font-weight="600" fill="#475569">-0.005</text>

</svg>
</div>
</body>
</html>
