<!DOCTYPE html>

  <text x="190" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Generic Coordinates</text>
  <text x="190" y="82" text-anchor="middle" font-size="10" fill="#b91c1c">All dimensions coupled</text>

  <!-- Grid showing full coupling: d_h x d_h matrix -->
  <!-- Dense matrix visualization -->
  <rect x="70" y="100" width="140" height="140" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>

  <!-- Fill with colored cells to show dense coupling -->

  <rect x="72" y="102" width="17" height="17" fill="#ef4444" opacity="0.7"/>

  <rect x="72" y="121" width="17" height="17" fill="#f87171" opacity="0.5"/>

  <rect x="148" y="121" width="17" height="17" fill="#f87171" opacity="0.7"/>

  <rect x="186" y="121" width="17" height="17" fill="#f87171" opacity="0.6"/>
  <!-- Row 3 -->
  <rect x="72" y="140" width="17" height="17" fill="#ef4444" opacity="0.6"/>
  <rect x="91" y="140" width="17" height="17" fill="#f87171" opacity="0.4"/>
  <rect x="110" y="140" width="17" height="17" fill="#ef4444" opacity="0.7"/>
  <rect x="129" y="140" width="17" height="17" fill="#f87171" opacity="0.5"/>
  <rect x="148" y="140" width="17" height="17" fill="#ef4444" opacity="0.6"/>

  <rect x="91" y="159" width="17" height="17" fill="#ef4444" opacity="0.6"/>
  <rect x="110" y="159" width="17" height="17" fill="#f87171" opacity="0.5"/>
  <rect x="129" y="159" width="17" height="17" fill="#ef4444" opacity="0.7"/>
  <rect x="148" y="159" width="17" height="17" fill="#f87171" opacity="0.4"/>
  <rect x="167" y="159" width="17" height="17" fill="#ef4444" opacity="0.6"/>
  <rect x="186" y="159" width="17" height="17" fill="#f87171" opacity="0.5"/>
  <!-- Row 5 -->
  <rect x="72" y="178" width="17" height="17" fill="#ef4444" opacity="0.7"/>
  <rect x="91" y="178" width="17" height="17" fill="#f87171" opacity="0.7"/>
  <rect x="110" y="178" width="17" height="17" fill="#ef4444" opacity="0.6"/>

  <!-- Labels -->
  <text x="140" y="252" text-anchor="middle" font-size="10" fill="#991b1b">Metric g (dense, d<tspan font-size="8" dy="-4">h</tspan><tspan dy="4"> &#215; d</tspan><tspan font-size="8" dy="-4">h</tspan><tspan dy="4">)</tspan></text>

  <!-- Kernel formula -->
  <text x="190" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">K(q, k) = exp(q&#7488; k / &#8730;d<tspan font-size="8" dy="-3">h</tspan><tspan dy="3">)</tspan></text>

  <!-- Cost box -->
  <rect x="55" y="300" width="270" height="50" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="190" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Cost: O(T&#178; &#183; d<tspan font-size="8" dy="-3">h</tspan><tspan dy="3">)</tspan></text>
  <text x="190" y="338" text-anchor="middle" font-size="10" fill="#b91c1c">All T&#178; pairs, full d<tspan font-size="8" dy="-3">h</tspan><tspan dy="3"> dot product each</tspan></text>

  <!-- Problem annotation -->
  <rect x="55" y="360" width="270" height="56" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
  <text x="190" y="380" text-anchor="middle" font-size="10" fill="#9f1239">Sum over j of products over s:</text>
  <text x="190" y="396" text-anchor="middle" font-size="10" font-weight="600" fill="#9f1239">&#931;<tspan font-size="8" dy="-3">j</tspan><tspan dy="3"> &#928;</tspan><tspan font-size="8" dy="-3">s</tspan><tspan dy="3"> K</tspan><tspan font-size="8" dy="-3">s</tspan><tspan dy="3">(q</tspan><tspan font-size="8" dy="-3">s</tspan><tspan dy="3">, k</tspan><tspan font-size="8" dy="-3">s</tspan><tspan dy="3">) &#8800; &#928;</tspan><tspan font-size="8" dy="-3">s</tspan><tspan dy="3"> &#931;</tspan><tspan font-size="8" dy="-3">j</tspan><tspan dy="3"> K</tspan><tspan font-size="8" dy="-3">s</tspan><tspan dy="3"></tspan></text>
  <text x="190" y="410" text-anchor="middle" font-size="9" fill="#be123c">Cannot precompute per axis!</text>

  <!-- ====== RIGHT: Stackel coordinates ====== -->
  <rect x="400" y="40" width="340" height="390" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="570" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">St&#228;ckel Coordinates</text>
  <text x="570" y="82" text-anchor="middle" font-size="10" fill="#15803d">Dimensions independent (diagonal metric)</text>

  <!-- Diagonal matrix visualization -->
  <rect x="450" y="100" width="140" height="140" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>

  <!-- Diagonal cells only -->
  <rect x="452" y="102" width="17" height="17" fill="#22c55e" opacity="0.8"/>
  <rect x="471" y="121" width="17" height="17" fill="#16a34a" opacity="0.7"/>
  <rect x="490" y="140" width="17" height="17" fill="#22c55e" opacity="0.8"/>
  <rect x="509" y="159" width="17" height="17" fill="#16a34a" opacity="0.6"/>
  <rect x="528" y="178" width="17" height="17" fill="#22c55e" opacity="0.7"/>
  <rect x="547" y="197" width="17" height="17" fill="#16a34a" opacity="0.8"/>
  <rect x="566" y="216" width="17" height="17" fill="#22c55e" opacity="0.7"/>

  <!-- Off-diagonal: very light / empty -->
  <!-- (implicitly empty = white background of container) -->

  <!-- Labels -->
  <text x="520" y="252" text-anchor="middle" font-size="10" fill="#166534">Metric &#936;*g (diagonal, d &#215; d)</text>

  <!-- Kernel formula: factored -->
  <text x="570" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">K = &#928;<tspan font-size="8" dy="-3">s=1..d</tspan><tspan dy="3"> K</tspan><tspan font-size="8" dy="-3">s</tspan><tspan dy="3">(z</tspan><tspan font-size="8" dy="-3">s</tspan><tspan dy="3">, z'</tspan><tspan font-size="8" dy="-3">s</tspan><tspan dy="3">)</tspan></text>

  <!-- Cost box -->
  <rect x="435" y="300" width="270" height="50" rx="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
  <text x="570" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Cost: O(R &#183; T &#183; d<tspan font-size="8" dy="-3">h</tspan><tspan dy="3">) , linear in T</tspan></text>
  <text x="570" y="338" text-anchor="middle" font-size="10" fill="#15803d">Precompute per axis, evaluate per query</text>

  <!-- Solution annotation -->
  <rect x="435" y="360" width="270" height="56" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="570" y="380" text-anchor="middle" font-size="10" fill="#166534">Density factorises &#8594; sums factorise:</text>
  <text x="570" y="396" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Precompute S<tspan font-size="8" dy="-3">n</tspan><tspan dy="3"> = &#931;</tspan><tspan font-size="8" dy="-3">j</tspan><tspan dy="3"> &#936;</tspan><tspan font-size="8" dy="-3">n</tspan><tspan dy="3">(z</tspan><tspan font-size="8" dy="-3">j</tspan><tspan dy="3">) &#183; v</tspan><tspan font-size="8" dy="-3">j</tspan><tspan dy="3"></tspan></text>
  <text x="570" y="410" text-anchor="middle" font-size="9" fill="#15803d">R = C(d+D, D) features, d = intrinsic dim</text>

  <!-- Central arrow -->
  <text x="380" y="168" text-anchor="middle" font-size="28" font-weight="700" fill="#475569">&#8594;</text>
  <text x="380" y="192" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b">Encoder &#936;</text>
