<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  .cg-wrap { position: relative; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #2A2927; }
  .cg-legend { display: flex; flex-wrap: wrap; gap: 13px; align-items: center; font-size: 12px; color: #64748b; margin-bottom: 12px; }
  .cg-sw { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid rgba(0,0,0,0.15); }
  .cg-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .cg-btn { font: 600 13px/1 -apple-system, sans-serif; padding: 6px 11px; border: 1px solid #d7d3ca; background: #f7f5f0; color: #44403c; border-radius: 7px; cursor: pointer; }
  .cg-btn:hover { background: #efece5; }
  .cg-slider { flex: 1; accent-color: #5b8c6e; }
  .cg-read { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; min-height: 22px; margin: 4px 0 12px; padding: 8px 10px; background: #faf8f4; border: 1px solid #ece8df; border-radius: 8px; }
  .cg-read.ref { background: #fbf1ef; border-color: #e3bbb4; }
  .cg-read.rot { background: #fbf3ea; border-color: #e0c08a; }
  .cg-year { font-family: "SF Mono", Menlo, monospace; font-size: 12px; font-weight: 700; color: #57534e; }
  .cg-who { font-size: 12px; color: #94a3b8; }
  .cg-badge { font-family: "SF Mono", Menlo, monospace; font-size: 11px; padding: 2px 7px; border-radius: 5px; border: 1px solid; white-space: nowrap; }
  .b-conj { background: #eef0f3; color: #475569; border-color: #cbd5e1; }
  .b-form { background: #e7f0ea; color: #3f6b51; border-color: #9bc1a8; }
  .b-ref  { background: #f6e3e1; color: #8f342d; border-color: #d9a39c; }
  .b-rot  { background: #f7e6d4; color: #92510f; border-color: #d9a86a; }
  .cg-subj { font-size: 12.5px; color: #44403c; flex: 1 1 280px; }
  .cg-svg { width: 100%; height: auto; display: block; }
  .cg-svg rect { transition: fill 0.3s, stroke 0.3s, opacity 0.3s; }
  .cg-svg text { transition: opacity 0.3s, fill 0.3s; }
  .cg-edge { fill: none; transition: opacity 0.3s, stroke 0.3s; }
  .cg-elabel { transition: opacity 0.3s, fill 0.3s; }
  .cg-hint { font-size: 12px; color: #94a3b8; margin-top: 8px; font-style: italic; }
</style>
</head>
<body>
<div class="cg-wrap">
  <div class="cg-legend">
    <span><span class="cg-sw" style="background:#f6f5f2;border:1px dashed #cdc8bd"></span>not yet stated</span>
    <span><span class="cg-sw" style="background:#eef0f3;border-color:#94a3b8"></span>conjectured</span>
    <span><span class="cg-sw" style="background:#e7f0ea;border-color:#3f6b51"></span>machine-checked</span>
    <span><span class="cg-sw" style="background:#fbe9e0;border-color:#c2722b"></span>silent sorryAx</span>
    <span><span class="cg-sw" style="background:#fdf3e2;border:1px dashed #c2722b"></span>blast radius (effective open)</span>
  </div>
  <div class="cg-controls">
    <button class="cg-btn" id="btnPlay">&#9658; Play</button>
    <button class="cg-btn" id="btnPrev">&#8249;</button>
    <input class="cg-slider" id="slider" type="range" min="0" max="5" value="5" step="1">
    <button class="cg-btn" id="btnNext">&#8250;</button>
  </div>
  <div class="cg-read" id="readout"></div>
  <svg class="cg-svg" id="graphSvg" viewBox="0 0 1240 600" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="cg-hint">PFR's WeakPFR strand. Drag the slider: the strand builds to machine-checked, then the module-system commit silently turns all seven results to sorryAx behind a green build.</div>
</div>

<script>
var SVGNS = "http://www.w3.org/2000/svg";
var HW = 96, HH = 23;
var STYLE = {
  absent: { fill:"#f6f5f2", stroke:"#cdc8bd", op:0.5, dash:"4 4", tag:"" },
  conj:   { fill:"#eef0f3", stroke:"#94a3b8", op:1, dash:"", tag:"CONJECTURED" },
  open:   { fill:"#eef0f3", stroke:"#94a3b8", op:1, dash:"", tag:"OPEN" },
  checked:{ fill:"#e7f0ea", stroke:"#3f6b51", op:1, dash:"", tag:"MACHINE-CHECKED" },
  rot:    { fill:"#fbe9e0", stroke:"#c2722b", op:1, dash:"", tag:"sorryAx (SILENT)" },
  blast:  { fill:"#fdf3e2", stroke:"#c2722b", op:1, dash:"5 3", tag:"EFFECTIVE: OPEN" }
};
var TAGCOLOR = { conj:"#64748b", open:"#64748b", checked:"#3f6b51", rot:"#b5651d", blast:"#b5651d", absent:"#a8a29e" };
var BMAP = { conjecture:["b-conj","conjecture"], formalize:["b-form","formalize"], contaminate:["b-rot","module system!"] };

var nodes = {
  entropy: { label:"Shannon entropy",     x:150, y:95 },
  ruzsa:   { label:"Ruzsa distance",      x:150, y:235 },
  tau:     { label:"tau-functional",      x:150, y:375 },
  proj:    { label:"PFR_projection",      x:150, y:515 },
  appent:  { label:"app_ent_PFR",         x:400, y:235 },
  tdist:   { label:"torsion_dist_shrink", x:640, y:150 },
  tfree:   { label:"torsion_free_doubling", x:640, y:375 },
  asymm:   { label:"weak_PFR_asymm",      x:870, y:262 },
  weak:    { label:"weak_PFR",            x:1090, y:150, hero:true },
  wint:    { label:"weak_PFR_int",        x:1090, y:375 },
  strong:  { label:"pfr_int_strong",      x:1090, y:515 }
};
var nodeOrder = ["entropy","ruzsa","tau","proj","appent","tdist","tfree","asymm","weak","wint","strong"];
var edges = [
  { s:"entropy", t:"ruzsa",  type:"dep" },
  { s:"ruzsa",   t:"tau",    type:"dep" },
  { s:"ruzsa",   t:"proj",   type:"dep" },
  { s:"tau",     t:"appent", type:"dep" },
  { s:"appent",  t:"tdist",  type:"dep" },
  { s:"tdist",   t:"tfree",  type:"dep" },
  { s:"proj",    t:"tfree",  type:"dep" },
  { s:"tfree",   t:"asymm",  type:"dep" },
  { s:"asymm",   t:"weak",   type:"dep" },
  { s:"weak",    t:"wint",   type:"dep" },
  { s:"wint",    t:"strong", type:"dep" }
];
var steps = [
  { y:"2023", who:"Marton / teorth/pfr", t:"conjecture", s:"the weak (entropy-route) Polynomial Freiman-Ruzsa conjecture is stated", set:{ weak:"conj" } },
  { y:"2023", who:"the formalisation", t:"formalize", s:"the Shannon-entropy and Ruzsa-distance machinery, the tau-functional, and the projection lemma are machine-checked", set:{ entropy:"checked", ruzsa:"checked", tau:"checked", proj:"checked" } },
  { y:"2023", who:"the formalisation", t:"formalize", s:"the approximate-entropy PFR inequality and the two torsion bounds are machine-checked", set:{ appent:"checked", tdist:"checked", tfree:"checked" } },
  { y:"2023", who:"everything compiles!", t:"formalize", s:"weak_PFR_asymm and weak_PFR are machine-checked; the strand is complete", set:{ asymm:"checked", weak:"checked" } },
  { y:"2024", who:"the formalisation", t:"formalize", s:"weak PFR over the integers and a downstream corollary are machine-checked", set:{ wint:"checked", strong:"checked" } },
  { y:"2026-05-01", who:"module-system migration (f24d957b)", t:"contaminate", s:"adopting Lean's module system leaves these proofs unfolding now-unexposed definition bodies, so all seven WeakPFR results silently rest on sorryAx; lake build still succeeds and CI stays green. The corollary that uses them is now effectively open.", set:{ appent:"rot", tdist:"rot", tfree:"rot", proj:"rot", asymm:"rot", weak:"rot", wint:"rot", strong:"blast" } }
];

var statusAt = [], cur = {};
for (var z = 0; z < nodeOrder.length; z++) cur[nodeOrder[z]] = "absent";
for (var st = 0; st < steps.length; st++) {
  for (var key in steps[st].set) cur[key] = steps[st].set[key];
  var snap = {}; for (var q in cur) snap[q] = cur[q]; statusAt.push(snap);
}

var svg = document.getElementById("graphSvg");
function txt(x, y, s, cls, size, sp, fill) {
  var el = document.createElementNS(SVGNS, "text");
  el.setAttribute("x", x); el.setAttribute("y", y); el.setAttribute("text-anchor", "middle");
  el.setAttribute("font-family", "-apple-system, sans-serif"); el.setAttribute("font-size", size);
  if (sp) el.setAttribute("letter-spacing", sp); el.setAttribute("fill", fill); el.textContent = s;
  if (cls) el.setAttribute("class", cls); svg.appendChild(el); return el;
}
function boxExit(cx, cy, ux, uy) {
  var tx = ux === 0 ? 1e9 : HW / Math.abs(ux), ty = uy === 0 ? 1e9 : HH / Math.abs(uy);
  var tt = Math.min(tx, ty); return [cx + ux * tt, cy + uy * tt];
}

var edgeEls = [];
for (var e = 0; e < edges.length; e++) {
  var ed = edges[e], s = nodes[ed.s], t = nodes[ed.t];
  var dx = t.x - s.x, dy = t.y - s.y, len = Math.sqrt(dx * dx + dy * dy), ux = dx / len, uy = dy / len;
  var p0 = boxExit(s.x, s.y, ux, uy), p1 = boxExit(t.x, t.y, -ux, -uy);
  var sx = p0[0], sy = p0[1], ex = p1[0], ey = p1[1];
  var path = document.createElementNS(SVGNS, "path");
  path.setAttribute("d", "M " + sx + " " + sy + " L " + ex + " " + ey);
  path.setAttribute("class", "cg-edge"); path.setAttribute("stroke", "#bdb8ad"); path.setAttribute("stroke-width", "1.5");
  svg.appendChild(path);
  var ah = document.createElementNS(SVGNS, "path");
  var bx = ux * 9, by = uy * 9, px = -uy * 4.5, py = ux * 4.5;
  ah.setAttribute("d", "M " + (ex - bx + px) + " " + (ey - by + py) + " L " + ex + " " + ey + " L " + (ex - bx - px) + " " + (ey - by - py));
  ah.setAttribute("class", "cg-edge"); ah.setAttribute("stroke", "#bdb8ad"); ah.setAttribute("stroke-width", "1.5"); ah.setAttribute("fill", "none");
  svg.appendChild(ah);
  edgeEls.push({ def: ed, path: path, ah: ah });
}

var nodeEls = {};
for (var g = 0; g < nodeOrder.length; g++) {
  var id = nodeOrder[g], nd = nodes[id];
  var rect = document.createElementNS(SVGNS, "rect");
  rect.setAttribute("x", nd.x - HW); rect.setAttribute("y", nd.y - HH);
  rect.setAttribute("width", HW * 2); rect.setAttribute("height", HH * 2); rect.setAttribute("rx", 9);
  rect.setAttribute("stroke-width", nd.hero ? 2.4 : 1.4);
  rect.setAttribute("fill", "#f6f5f2"); rect.setAttribute("stroke", "#cdc8bd");
  svg.appendChild(rect);
  var tag = txt(nd.x, nd.y - 7, "", null, 8.5, 1.3, "#94a3b8");
  tag.setAttribute("font-family", "'SF Mono', Menlo, monospace");
  var nm = txt(nd.x, nd.y + 13, nd.label, null, 12.5, 0, "#2A2927");
  nm.setAttribute("font-family", "'SF Mono', Menlo, monospace");
  nm.setAttribute("font-weight", nd.hero ? "700" : "500");
  nodeEls[id] = { rect: rect, tag: tag, name: nm };
}

function render(idx) {
  var stt = statusAt[idx];
  for (var id in nodeEls) {
    var ne = nodeEls[id], stat = stt[id], sty = STYLE[stat];
    ne.rect.setAttribute("fill", sty.fill); ne.rect.setAttribute("stroke", sty.stroke); ne.rect.setAttribute("opacity", sty.op);
    if (sty.dash) ne.rect.setAttribute("stroke-dasharray", sty.dash); else ne.rect.removeAttribute("stroke-dasharray");
    ne.tag.textContent = sty.tag; ne.tag.setAttribute("fill", TAGCOLOR[stat]);
    ne.name.setAttribute("opacity", stat === "absent" ? 0.5 : 1);
  }
  for (var i = 0; i < edgeEls.length; i++) {
    var ee = edgeEls[i], d = ee.def, ss = stt[d.s], ts = stt[d.t];
    var live = ss !== "absent" && ts !== "absent", col = "#bdb8ad", op = live ? 1 : 0.12;
    var hot = (ss === "rot" || ss === "blast" || ts === "rot" || ts === "blast");
    if (hot) { col = "#c2722b"; op = 1; }
    ee.path.setAttribute("stroke", col); ee.ah.setAttribute("stroke", col); ee.path.setAttribute("opacity", op); ee.ah.setAttribute("opacity", op);
    ee.path.setAttribute("stroke-width", hot ? 2 : 1.5); ee.ah.setAttribute("stroke-width", hot ? 2 : 1.5);
  }
  var sp = steps[idx], bm = BMAP[sp.t];
  readout.innerHTML = '<span class="cg-year">' + sp.y + '</span><span class="cg-who">' + sp.who + '</span>' +
    '<span class="cg-badge ' + bm[0] + '">' + bm[1] + '</span><span class="cg-subj">' + sp.s.replace(/</g, "&lt;") + '</span>';
  readout.className = "cg-read" + (sp.t === "contaminate" ? " rot" : "");
}

var slider = document.getElementById("slider");
var readout = document.getElementById("readout");
var btnPlay = document.getElementById("btnPlay"), btnPrev = document.getElementById("btnPrev"), btnNext = document.getElementById("btnNext");
var timer = null;
function setIdx(i) { i = Math.max(0, Math.min(steps.length - 1, i)); slider.value = i; render(i); }
slider.addEventListener("input", function() { render(parseInt(slider.value, 10)); });
btnPrev.addEventListener("click", function() { stop(); setIdx(parseInt(slider.value, 10) - 1); });
btnNext.addEventListener("click", function() { stop(); setIdx(parseInt(slider.value, 10) + 1); });
function stop() { if (timer) { clearInterval(timer); timer = null; btnPlay.textContent = "► Play"; } }
btnPlay.addEventListener("click", function() {
  if (timer) { stop(); return; }
  if (parseInt(slider.value, 10) >= steps.length - 1) setIdx(0);
  btnPlay.textContent = "❚❚ Pause";
  timer = setInterval(function() { var nx = parseInt(slider.value, 10) + 1; if (nx >= steps.length) { stop(); return; } setIdx(nx); }, 1300);
});
render(parseInt(slider.value, 10));
</script>
</body>
</html>
